version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uae-job-copilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: uae_jobs
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d uae_jobs"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Adminer for DB management UI
  adminer:
    image: adminer:latest
    container_name: uae-job-copilot-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
